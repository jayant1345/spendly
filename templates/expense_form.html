{% extends "base.html" %}
{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">

    <div class="auth-header">
      <h1>Add Expense</h1>
      <p>Record a new transaction to your account.</p>
    </div>

    <div class="auth-card">
      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('add_expense') }}">

        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" name="amount"
                 class="form-input" step="0.01" min="0.01"
                 value="{{ form.amount }}" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" class="form-input" required>
            <option value="" disabled {% if not form.category %}selected{% endif %}>Select a category</option>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if form.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date"
                 class="form-input"
                 value="{{ form.date }}" required>
        </div>

        <div class="form-group">
          <label for="description">Description <small>(optional)</small></label>
          <input type="text" id="description" name="description"
                 class="form-input" maxlength="200"
                 placeholder="e.g. Grocery run"
                 value="{{ form.description }}">
        </div>

        <button type="submit" class="btn-submit">Add Expense</button>

      </form>
    </div>

    <p class="auth-footer-link">
      <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </p>

  </div>
</section>
{% endblock %}
